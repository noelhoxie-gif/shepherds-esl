<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar | ESL Ministry</title>
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Libre+Franklin:wght@400;600&family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600;700&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#calendar">Skip to calendar</a>

  <header class="site-header">
    <div class="container header-main">
      <a class="brand" href="index.html" aria-label="ESL Ministry home">
        <img src="assets/images/logo-white.png" alt="The Shepherd's Church" width="200" height="70" />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-program"><small>Volunteer Portal</small>ESL Ministry</span>
      </a>
      <nav class="main-nav is-static portal-nav" aria-label="Volunteer pages">
        <ul></ul>
      </nav>
    </div>
  </header>

  <main id="calendar">
    <div class="hero page-hero curve-bottom">
      <div class="container">
        <p class="hero-eyebrow">Volunteer Portal</p>
        <h1>Calendar</h1>
      </div>
    </div>

    <div class="section section-light">
      <div class="container">
        <div class="notice" id="volunteer-setup" hidden></div>
        <div id="portal-content" hidden>
          <div class="portal-heading">
            <div>
              <h2 id="calendar-month">Calendar</h2>
              <p>ESL meets on Fridays. Click a day to see everyone who requested to be out.</p>
            </div>
            <div class="calendar-controls" aria-label="Calendar controls">
              <button class="portal-button" id="calendar-previous" type="button">Previous month</button>
              <button class="portal-button" id="calendar-today" type="button">This month</button>
              <button class="portal-button" id="calendar-next" type="button">Next month</button>
            </div>
          </div>

          <div class="level-filters" id="level-filters" aria-label="Filter by class level"></div>

          <div id="class-calendar-grid" class="friday-list" aria-labelledby="calendar-month"></div>
        </div>
      </div>
    </div>

    <div id="attendance-overlay" class="attendance-overlay" hidden>
      <div class="attendance-dialog" role="dialog" aria-modal="true" aria-labelledby="attendance-title">
        <div class="attendance-dialog-head">
          <div>
            <p class="attendance-kicker">Attendance</p>
            <h2 id="attendance-title">Who is out</h2>
            <p id="attendance-count"></p>
          </div>
          <button class="portal-button" id="attendance-close" type="button">Close</button>
        </div>
        <div id="attendance-list" class="attendance-list"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">&copy; <span id="year">2026</span> The Shepherd&rsquo;s Church &middot; ESL Ministry</div>
  </footer>

  <script src="assets/js/class-levels.js"></script>
  <script src="assets/js/class-calendar.js"></script>
  <script src="assets/js/portal-common.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
