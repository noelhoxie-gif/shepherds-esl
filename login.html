<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer Login | ESL Ministry</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Libre+Franklin:wght@400;600&family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600;700&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#login-form">Skip to login</a>

  <header class="site-header">
    <div class="container header-main">
      <a class="brand" href="index.html" aria-label="ESL Ministry home">
        <img src="assets/images/logo-white.png" alt="The Shepherd's Church" width="200" height="70" />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-program"><small>Volunteer Portal</small>ESL Ministry</span>
      </a>
      <nav class="main-nav is-static" aria-label="Main">
        <ul>
          <li><a href="index.html">Public site</a></li>
          <li><a href="login.html" aria-current="page">Volunteer Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card">
        <p class="hero-eyebrow" style="color: var(--gold)">Volunteers only</p>
        <h1>Sign in</h1>
        <p>Use the email and password created for you in the ESL volunteer portal.</p>

        <div class="notice" id="login-setup" hidden></div>
        <div class="form-error" id="login-error" hidden></div>

        <form id="login-form" novalidate>
          <label for="username">Email</label>
          <input id="username" name="username" type="email" autocomplete="username" required placeholder="you@example.com" />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <button class="btn btn-red btn-flat" id="login-submit" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">&copy; <span id="year">2026</span> The Shepherd&rsquo;s Church &middot; ESL Ministry</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/env.js"></script>
  <script>window.ESL_CONFIG = window.ESL_CONFIG || { supabaseUrl: "", supabaseAnonKey: "" };</script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/login.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
