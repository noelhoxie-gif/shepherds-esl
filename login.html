<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer Login | ESL Ministry</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Libre+Franklin:wght@400;600&family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600;700&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#login-form">Skip to login</a>

  <header class="site-header">
    <div class="container header-main">
      <a class="brand" href="index.html" aria-label="ESL Ministry home">
        <img src="assets/images/logo-white.png" alt="The Shepherd's Church" width="200" height="70" />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-program"><small>Volunteer Portal</small>ESL Ministry</span>
      </a>
      <nav class="main-nav is-static" aria-label="Main">
        <ul>
          <li><a href="index.html">Public site</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card">
        <p class="hero-eyebrow" style="color: var(--gold)">Volunteers only</p>
        <h1 id="auth-heading">Sign in</h1>
        <p id="auth-copy">Use your username or email and password to open the volunteer pages.</p>

        <div class="auth-methods auth-tabs" role="tablist" aria-label="Account">
          <button class="auth-method is-active" type="button" data-panel="signin" aria-selected="true">Sign in</button>
          <button class="auth-method" type="button" data-panel="signup" aria-selected="false">Create account</button>
        </div>

        <div class="form-error" id="login-error" role="alert" hidden></div>
        <div class="form-success" id="login-success" role="status" hidden></div>

        <form id="login-form" class="auth-panel" novalidate>
          <label for="login">Username or email</label>
          <input id="login" name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <button class="btn btn-red btn-flat" id="login-submit" type="submit">Sign in</button>
          <button class="text-button auth-forgot" id="forgot-link" type="button">Forgot password?</button>
        </form>

        <form id="recover-form" class="auth-panel" hidden novalidate>
          <label for="recover-login">Username or email</label>
          <input id="recover-login" name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />

          <button class="btn btn-red btn-flat" id="recover-submit" type="submit">Send reset email</button>
          <button class="text-button auth-forgot" id="recover-back" type="button">Back to sign in</button>
        </form>

        <form id="reset-form" class="auth-panel" hidden novalidate>
          <label for="reset-password">New password</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" required />

          <label for="reset-password-confirm">Confirm new password</label>
          <input id="reset-password-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required />

          <button class="btn btn-red btn-flat" id="reset-submit" type="submit">Save new password</button>
        </form>

        <form id="signup-form" class="auth-panel" hidden novalidate>
          <label for="signup-name">Your name</label>
          <input id="signup-name" name="displayName" type="text" maxlength="80" autocomplete="name" />

          <label for="signup-username">Username</label>
          <input id="signup-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />

          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" required />

          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required />

          <button class="btn btn-red btn-flat" id="signup-submit" type="submit">Create account</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">&copy; <span id="year">2026</span> The Shepherd&rsquo;s Church &middot; ESL Ministry</div>
  </footer>

  <script src="assets/js/login.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
