<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request a Week Off | ESL Ministry</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Libre+Franklin:wght@400;600&family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600;700&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#week-off">Skip to week-off request</a>

  <header class="site-header">
    <div class="container header-main">
      <a class="brand" href="index.html" aria-label="ESL Ministry home">
        <img src="assets/images/logo-white.png" alt="The Shepherd's Church" width="200" height="70" />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-program"><small>Volunteer Portal</small>ESL Ministry</span>
      </a>
      <nav class="main-nav is-static portal-nav" aria-label="Volunteer portal">
        <ul>
          <li><span id="volunteer-user" class="nav-user"></span></li>
          <li><button class="text-button" id="logout-button" type="button">Sign out</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="week-off">
    <div class="hero page-hero curve-bottom">
      <div class="container">
        <p class="hero-eyebrow">Volunteer Portal</p>
        <h1>Request a Week Off</h1>
      </div>
    </div>

    <div class="section section-light">
      <div class="container portal-form-layout">
        <div class="notice" id="volunteer-setup" hidden></div>
        <div id="portal-content" hidden>
          <div class="card request-card">
            <h2>Let the ESL Team Know</h2>
            <p>Select the Friday you will miss so the team can plan class and building assignments.</p>
            <form id="week-off-form" class="portal-form">
              <label for="week-off-date">Friday you need off</label>
              <input id="week-off-date" name="week_of" type="date" required />

              <label for="week-off-assignment">Usual class or assignment</label>
              <input id="week-off-assignment" name="assignment" type="text" maxlength="120" placeholder="Example: Beginner class, Family Center" />

              <label for="week-off-note">Note for the coordinator <span>(optional)</span></label>
              <textarea id="week-off-note" name="note" rows="4" maxlength="500" placeholder="Add any information that will help with coverage."></textarea>

              <button class="btn btn-flat" type="submit">Submit Request</button>
              <p id="week-off-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
          </div>

          <div class="request-history">
            <h2>Your Requests</h2>
            <p id="week-off-empty" class="portal-empty" hidden>You have not requested any weeks off.</p>
            <div id="week-off-list" class="announcement-list"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">&copy; <span id="year">2026</span> The Shepherd&rsquo;s Church &middot; ESL Ministry</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/env.js"></script>
  <script>window.ESL_CONFIG = window.ESL_CONFIG || { supabaseUrl: "", supabaseAnonKey: "" };</script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/week-off.js"></script>
  <script src="assets/js/portal-common.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
